<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CFO - Financial Transaction</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>🤖 AI CFO</h2>
            </div>
            <nav>

                <a href="index.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>

                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> Analytics
                </a>

                <a href="transactions.html" class="nav-item active">
                    <i class="fas fa-file-invoice"></i> Transactions
                </a>

                <a href="compliance.html" class="nav-item">
                    <i class="fas fa-shield-alt"></i> Compliance
                </a>

                <a href="assistant.html" class="nav-item">
                    <i class="fas fa-robot"></i> AI Assistant
                </a>
            </nav>
            <div class="user-info">
                <div class="avatar">🚀</div>
                <div>
                    <p id="teamName"></p>
                    <!-- <small id="teamRole"></small> -->
                </div>
            </div>
        </div>


        <!-- Main Content -->
        <div class="main-content">

            <!-- Top Nav -->
            <header>

                <div></div>

                <div class="header-right">

                    <button onclick="openTransactionModal()" class="btn-refresh">
                        + Add Transaction
                    </button>

                    <button id="refreshBtn" onclick="refreshDashboard()" class="btn-refresh">
                        🔄 Refresh
                    </button>

                </div>

            </header>

            <!-- Transactions Page -->

            <div class="transactions-page">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h2 class="mb-1">
                            All Transactions
                        </h2>

                        <small class="text-muted">
                            Showing all transactions with pagination
                        </small>

                    </div>

                </div>

                <div class="transactions">

                    <table id="transactions-table">

                        <thead>

                            <tr>

                                <th>Date</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody></tbody>

                    </table>

                    <!-- Pagination -->

                    <div id="pagination" class="pagination-container mt-4">
                    </div>

                </div>

            </div>

        </div>


        <div class="modal fade" id="transactionModal" tabindex="-1">

            <div class="modal-dialog modal-dialog-centered modal-md">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Add Transaction
                        </h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <input type="number" id="txAmount" class="form-control mb-3" placeholder="Amount">

                        <select id="txCategory" class="form-select mb-3">

                            <option value="Revenue">Revenue</option>
                            <option value="Operations">Operations</option>
                            <option value="Investment">Investment</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="HR">HR</option>
                            <option value="Technology">Technology</option>
                            <option value="Finance">Finance</option>

                        </select>

                        <input type="text" id="txDescription" class="form-control mb-3" placeholder="Description">

                        <select id="txType" class="form-select">

                            <option value="income">Income</option>
                            <option value="expense">Expense</option>

                        </select>

                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="button" class="btn btn-primary" onclick="saveTransaction()">
                            Save Transaction
                        </button>

                    </div>

                </div>

            </div>

        </div>
    </div>
    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
